description = "Read your RSS and Atom feeds in a tab of their own or a panel beside your work, with the unread count"
version = "1.1.0"
command = "python3 main.py"
# panes: to open its tab or panel, draw it and show the unread count on it.
permissions = ["panes"]

[settings.feeds]
type = "list"
default = []
description = "Feed addresses (RSS or Atom), like https://example.com/feed.xml"

[settings.refresh-minutes]
type = "integer"
default = 30
min = 5
max = 1440
description = "How often to check the feeds, in minutes"
